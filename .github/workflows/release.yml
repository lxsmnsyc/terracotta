name: Release

# The 2.x line ships prereleases from `2.x` while `.changeset/pre.json` keeps
# Changesets in pre mode, so versions come out as `2.0.0-next.N` under the
# `next` dist-tag.
#
# Pull requests into `2.x` run the tests. Every push to `2.x` runs them too, and
# then either opens (or updates) a "Version Packages" pull request from the
# pending changesets, or, once that pull request is merged, publishes whatever
# versions are not on npm yet.
on:
  push:
    branches:
      - 2.x
  pull_request:
    branches:
      - 2.x

# Two releases racing each other could both try to publish the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit rather than a tag, since this
      # workflow can publish to npm.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The focus query unit tests and the end-to-end tests run in Chromium.
      - run: pnpm --filter terracotta exec playwright install --with-deps chromium

      - run: pnpm typecheck

      - run: pnpm skill:check

      - run: pnpm --filter terracotta test

      - run: pnpm --filter terracotta test:e2e

      - run: pnpm --filter terracotta build

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push release tags and open GitHub releases
      pull-requests: write # open the Version Packages pull request
      id-token: write # authenticate to npm through trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `changeset git-tag` only tags versions without a tag, so it needs the
          # existing ones. A shallow clone would have it re-tag every release.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          # No `registry-url`: it writes an `.npmrc` expecting `NODE_AUTH_TOKEN`,
          # and there is no token here to give it. Trusted publishing
          # authenticates without one.

      # Trusted publishing needs npm 11.5.1 or later, newer than some Node 24
      # releases bundle.
      - run: npm install --global npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      # Publishing builds again, but a build that breaks there would do so after
      # the version pull request has merged, leaving a bumped version with
      # nothing published. Failing here stops the release before that.
      - run: pnpm --filter terracotta build

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Versions the packages and refreshes the lockfile to match, so the
          # merged pull request still installs with `--frozen-lockfile`.
          version-script: pnpm cs:ver
          # Publishes each new version under its prerelease tag (`next`), not
          # `latest`. See `scripts/publish.ts`.
          publish-script: pnpm release
          commit-message: 'chore: version packages (next)'
          pr-title: 'chore: version packages (next)'
