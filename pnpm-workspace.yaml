# pnpm settings live here rather than in `.npmrc`, which is where recent
# versions read them from.
#
# minimumReleaseAge: pnpm 11 refuses to install any package published within
# the last day, which is a sensible supply-chain default and one this project
# trips over regularly: the toolchain (oxlint, the Solid packages, Terracotta
# itself) is on prereleases that are often hours old when the lockfile is
# updated, and a deploy on the same day then fails the policy check rather than
# the build. An hour keeps the guard against a release published minutes ago,
# while letting a reviewed lockfile deploy the day it is written.
#
# strictDepBuilds: esbuild's install script has never run in this project.
# pnpm blocks dependency build scripts unless they are allowlisted, esbuild
# works without it, and pnpm 11 promotes that from a warning to a hard error.
# This restores it to a warning rather than allowlisting a script nothing needs.
minimumReleaseAge: 60
strictDepBuilds: false
